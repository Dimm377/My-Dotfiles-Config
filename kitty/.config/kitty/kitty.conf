# Migrated from ~/.config/foot/foot.ini
shell /usr/bin/fish
# Font: Cascadia Code (CaskaydiaCove Nerd Font)
font_family CaskaydiaCove Nerd Font
font_size 14
# Foot: pad=25x25
window_padding_width 25
# Foot: scrollback lines=10000
scrollback_lines 10000
# Foot: cursor style=beam, beam-thickness=1.5
cursor_shape beam
cursor_beam_thickness 1.5
# Foot: colors-dark alpha=0.78
background_opacity 0.78

# Caelestia wallpaper palette integration
allow_remote_control socket-only
listen_on unix:${XDG_RUNTIME_DIR}/kitty-caelestia.sock
window_border_width 1.5pt
draw_minimal_borders yes
active_border_color #c6c6c6
inactive_border_color #767676

# Foot: scrollback-up/down-page = Page_Up/Page_Down
map page_up scroll_page_up
map page_down scroll_page_down

# Foot: search-start = Control+Shift+f
map ctrl+shift+f search_scrollback
